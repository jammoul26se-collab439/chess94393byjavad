<!Doctype html>
<html>
    <head>
        <meta charset = "UTF-8">
        <meta name= "viewport" content = "width=device-width , initial-scale=1.0">
        <title>Chess Game</title>
        <link rel="stylesheet" href="css/style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <main>
           <div class = "chess-container">
               <h1 id="chess-game-title" style="background-color: #0b2a4a; padding:8px 15px; display:inline-block; color:white; font-weight:bold; "></h1>
                 <div id="start-screen">
                    <div id="loading-text">Loading</div>
                    <div id="start-block">
                        <button id="start-button">Start</button>
                     </div>
                    </div>
                    <div id="check-message">Check!</div>
                    <div id = "game-over-message"></div>
                 <div id="timers">
                    <div id="black-timer">00:00</div>
                    <div id="white-timer">00:00</div>
                 </div>
                 <canvas id="chess-board"></canvas>
                 <div id="promotion-menu">
                    <p>Select the piece you want to choose</p>
                    <button id="bishop-btn">Bishop</button>
                    <button id="knight-btn">Knight</button>
                    <button id="queen-btn">Queen</button>
                    <button id="rook-btn">Rook</button>
                 </div>
           </div>
        </main>
        <script src = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>  
        <script src = "js/pieces/piece.js"></script>
        <script src = "js/pieces/pieces.js"></script>
        <script src = "js/game/board.js"></script>
        <script src = "js/game/rules.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
